# Short Drama Quality Assessment - Scoring Rules Config
# Defines threshold ranges and piecewise linear mapping rules for each metric

# ============ Uniform Scoring Conventions (read these before any scoring) ============
# 1. Contiguous tiers: every tier's `range` is an inclusive integer interval
#    [min, max]; the next tier always starts at prev.max + 1 (no gaps, no overlap).
# 2. Fractional raw values: before matching, clamp the raw value to the metric's
#    domain (first tier min ~ last tier max), then round to the nearest integer
#    (0.5 rounds up). This guarantees every real value matches exactly one tier.
# 3. Reverse metrics: "lower is better" metrics (cliffhanger_failure_rate,
#    churn_point_distribution) have DESCENDING score ranges (score_min > score_max);
#    the unified linear formula below then yields a negative slope automatically.
# 4. Point tier: when range_min == range_max, the tier returns the constant score
#    score_min; no division happens.
# 5. Inheritance: a drama type may declare `_inherit: <base_type>`; any metric not
#    explicitly defined under that type falls back to the base type's tiers.

# Grade definitions
grade_definitions:
  - grade: S
    score_range: [85, 100]
    label: Potential Hit
    action: Full Promotion
  - grade: A
    score_range: [70, 84]
    label: Quality Content
    action: Continued Investment
  - grade: B
    score_range: [55, 69]
    label: Average
    action: Targeted Optimization
  - grade: C
    score_range: [40, 54]
    label: Multiple Issues
    action: Key Rectification
  - grade: D
    score_range: [0, 39]
    label: Poor Quality
    action: Stop Loss

# Piecewise linear mapping rules
# Each metric defines threshold ranges; different drama types may set different thresholds
# Range format: [min_value, max_value] → [score_min, score_max]

scoring_rules:
