# Scoring calculation function notes (for the Agent):
#
# 0. Normalize the raw value before tier matching:
#    value = clamp(raw_value, first_tier.range_min, last_tier.range_max)
#    value = round_half_up(value)   # to the nearest integer; 0.5 rounds up
#    then find the tier whose range contains the integer value.
#
# 1. Linear mapping function:
#    score = score_min + (value - range_min) / (range_max - range_min) * (score_max - score_min)
#    - reverse metrics: score_min > score_max, so the slope is negative (works unchanged).
#    - point tier (range_min == range_max): score = score_min, skip the division.
#
# 2. Dimension score calculation:
#    metric average = Σ(metric scores in the dimension) / metric count
#    If a sub-metric is missing (insufficient data), drop it and re-normalize the
#    remaining sub-metric weights proportionally so they still sum to 1; mark the
#    dropped sub-metric as N/A in the report.
#
# 3. Dimension score = weighted average of all metric scores in the dimension
#    (sub-metric weights come from references/dimension_details.md).
#
# 4. Total score calculation:
#    total = Σ(dimension score × dimension weight) / Σ(dimension weight)
#    (missing dimensions are excluded; their weights are reallocated proportionally.)
#
# 5. Per-episode score:
#    run the above calculation flow independently for each episode.
