  description: 诊断数据上报至交付的延迟与新鲜度问题，提供有依据的结论和行动建议。
en:
  name: AE Data Delay Troubleshooter
  description: Diagnose ingestion-to-delivery delay and freshness issues with evidence-based findings and actions.
